<v-card>
  <!-- Botón de cierre -->
  <div class="d-flex justify-end pa-2">
    <v-btn text icon @click="$emit('close')">
      <v-icon>mdi-close</v-icon>
    </v-btn>
  </div>

  <!-- Título -->
  <v-card-title class="text-center justify-center">
    <span class="headline">Editar Perfil</span>
  </v-card-title>

  <!-- Formulario -->
  <v-card-text>
    <v-form ref="form" v-model="valid" lazy-validation>
      <v-text-field
        label="Correo electrónico"
        v-model="email"
        type="email"
        :rules="[rules.required, rules.email]"
        prepend-icon="mdi-email"
        outlined
        dense
        class="mb-3"
      />

      <v-text-field
        label="Contraseña actual"
        v-model="oldPassword"
        type="password"
        prepend-icon="mdi-lock"
        outlined
        dense
        class="mb-3"
      />

      <v-text-field
        label="Nueva contraseña"
        v-model="newPassword"
        type="password"
        prepend-icon="mdi-lock-reset"
        outlined
        dense
        class="mb-3"
      />

      <v-text-field
        label="Confirmar nueva contraseña"
        v-model="confirmPassword"
        type="password"
        :rules="[rules.passwordMatch]"
        prepend-icon="mdi-lock-check"
        outlined
        dense
      />
    </v-form>
  </v-card-text>

  <!-- Botones de acción -->
  <v-card-actions class="d-flex flex-column">
    <v-btn
      color="primary"
      block
      class="mb-2"
      :disabled="!valid"
      @click="saveChanges"
    >
      <v-icon left>mdi-content-save</v-icon>
      Guardar cambios
    </v-btn>

    <v-btn
      color="error"
      block
      class="mb-2"
      @click="confirmDeleteUser"
    >
      <v-icon left>mdi-account-remove</v-icon>
      Eliminar cuenta
    </v-btn>


    <!-- Snackbar -->
    <v-snackbar v-model="snackbar.show" :color="snackbar.color" timeout="3000">
      {{ snackbar.text }}
    </v-snackbar>

    <!-- Diálogo de confirmación -->
    <v-dialog v-model="showDeleteDialog" max-width="420">
      <v-card>
        <v-card-title class="headline red--text">
          ⚠️ Confirmar eliminación
        </v-card-title>

        <v-card-text>
          ¿Seguro que quieres eliminar tu cuenta?
          <strong>Esta acción no se puede deshacer y eliminara todos los archivos(publicos y privados).</strong>
        </v-card-text>

        <v-card-actions>
          <v-spacer></v-spacer>
          <v-btn text color="grey darken-1" @click="showDeleteDialog = false">
            Cancelar
          </v-btn>
          <v-btn color="red darken-2" dark @click="deleteUserConfirmed">
            Eliminar
          </v-btn>
        </v-card-actions>
      </v-card>
    </v-dialog>
  </v-card-actions>
</v-card>
